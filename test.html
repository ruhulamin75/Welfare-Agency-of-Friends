<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIF Receipt System</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            /* সম্পূর্ণ সবুজ থিম */
            --primary-color: #15803d;
            --accent-color: #22c55e;
            --success-color: #16a34a;
            --bg-gradient: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
            --text-main: #1f2937;
            --text-muted: #4b5563;
            --border-color: #d1d5db;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background: var(--bg-gradient);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(21, 128, 61, 0.08);
            transition: all 0.3s ease;
        }

        h2.form-title {
            text-align: center;
            color: var(--primary-color);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            position: relative;
        }

        h2.form-title::after {
            content: '';
            width: 60px;
            height: 4px;
            background: var(--accent-color);
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label.field-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
            font-size: 15px;
        }

        input[type="text"], input[type="number"], input[type="date"], select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            font-family: 'Hind Siliguri', sans-serif;
            transition: all 0.3s ease;
            background-color: #f9fafb;
        }

        input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus, select:focus {
            border-color: var(--accent-color);
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.15);
        }

        input[readonly] {
            background-color: #dcfce7 !important;
            border-color: #bbf7d0 !important;
            color: var(--primary-color);
            font-weight: 600;
            cursor: not-allowed;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 15px;
            color: var(--text-main);
        }

        .checkbox-label input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            transform: scale(1.2);
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        button.submit-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            margin-top: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Hind Siliguri', sans-serif;
            box-shadow: 0 4px 6px rgba(21, 128, 61, 0.2);
        }

        button.submit-btn:hover {
            background: #166534;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(21, 128, 61, 0.3);
        }

        .hidden { display: none !important; }

        /* রিসিট ডিজাইন (এক পেজে ফিট করার জন্য) */
        #receipt-section {
            background: #fff;
            padding: 30px 40px; 
            border: 1px solid #d1d5db;
            border-radius: 4px;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        #receipt-section::before {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background-image: url('logodif.png'); 
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.08; 
            z-index: -1;
        }

        .receipt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }

        .receipt-header-left img {
            max-height: 70px;
        }

        .receipt-header-right {
            text-align: right;
        }

        .receipt-header-right h1 {
            margin: 0 0 5px 0;
            color: var(--primary-color);
            font-size: 24px;
            font-weight: 700;
        }

        .receipt-header-right p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.4;
        }

        .receipt-title {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .receipt-title span {
            background-color: var(--primary-color);
            color: white;
            padding: 6px 20px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(21, 128, 61, 0.15);
            display: inline-block;
        }

        .receipt-meta {
            display: flex;
            justify-content: space-between;
            background: #f0fdf4;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #bbf7d0;
        }

        .meta-item { font-size: 15px; }
        .meta-item span {
            font-weight: 700;
            color: var(--primary-color);
            margin-left: 5px;
        }

        .receipt-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px; 
        }

        .receipt-table th, .receipt-table td {
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        .receipt-table th {
            width: 35%;
            color: var(--text-muted);
            font-weight: 600;
            background: #f9fafb;
        }

        .receipt-table td {
            font-weight: 500;
            color: var(--text-main);
        }

        .amount-row td {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary-color);
            background: #dcfce7;
        }

        .amount-words-box {
            background: #f0fdf4;
            border-left: 4px solid var(--primary-color);
            padding: 12px 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 30px;
            font-size: 16px;
            color: #166534;
        }

        .amount-words-box strong { color: var(--primary-color); }

        .signatures {
            display: flex;
            justify-content: flex-end; 
            margin-top: 30px;
        }

        .sig-box {
            text-align: center;
            width: 200px;
        }

        .sig-box img {
            max-height: 50px;
            margin-bottom: 5px;
        }

        .sig-line {
            border-top: 1.5px dashed #9ca3af;
            padding-top: 5px;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 14px;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Hind Siliguri', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-download { background: var(--success-color); color: white; }
        .btn-download:hover { background: #15803d; transform: translateY(-2px); }
        .btn-edit { background: #ef4444; color: white; }
        .btn-edit:hover { background: #dc2626; transform: translateY(-2px); }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: 1; }
            .checkbox-group { grid-template-columns: repeat(2, 1fr); }
            .receipt-header { flex-direction: column; text-align: center; }
            .receipt-header-right { text-align: center; margin-top: 15px; }
            .receipt-meta { flex-direction: column; gap: 10px; text-align: center; }
            .signatures { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <h2 class="form-title">পেমেন্ট রিসিট এন্ট্রি</h2>
    <form id="receiptForm">
        <div class="form-grid">
            <div class="form-group">
                <label class="field-label">তারিখ <span style="color:red;">*</span></label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label class="field-label">টাকার পরিমাণ (অঙ্কে) <span style="color:red;">*</span></label>
                <input type="number" id="amount" required placeholder="যেমন: 5000">
            </div>
            
            <div class="form-group full-width">
                <label class="field-label">সদস্যের আইডি ও নাম <span style="color:red;">*</span></label>
                <select id="memberSelect" required>
                    <option value="" disabled selected>তালিকা থেকে সদস্য নির্বাচন করুন</option>
                    <!-- জাভাস্ক্রিপ্ট দ্বারা অপশনগুলো যুক্ত হবে -->
                </select>
            </div>
            
            <div class="form-group full-width">
                <label class="field-label">জমার খাত <span style="color:red;">*</span> (একাধিক নির্বাচন করা যাবে)</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" name="category" value="ভর্তি ফি"> ভর্তি ফি</label>
                    <label class="checkbox-label"><input type="checkbox" name="category" value="এককালীন"> এককালীন</label>
                    <label class="checkbox-label"><input type="checkbox" name="category" value="মাসিক জমা"> মাসিক জমা</label>
                    <label class="checkbox-label"><input type="checkbox" name="category" value="ডোনেশন"> ডোনেশন</label>
                    <label class="checkbox-label"><input type="checkbox" name="category" value="জরিমানা"> জরিমানা</label>
                    <label class="checkbox-label"><input type="checkbox" name="category" value="অন্যান্য"> অন্যান্য</label>
                </div>
            </div>

            <div class="form-group full-width">
                <label class="field-label">ঠিকানা (ঐচ্ছিক)</label>
                <input type="text" id="address" placeholder="বর্তমান ঠিকানা">
            </div>

            <div class="form-group full-width">
                <label class="field-label">বিবরণ (ঐচ্ছিক)</label>
                <input type="text" id="description" placeholder="যেকোনো অতিরিক্ত বিবরণ">
            </div>
            
            <div class="form-group full-width">
                <label class="field-label">টাকার পরিমাণ (কথায়) <span style="color:red;">*</span></label>
                <input type="text" id="amountWords" required readonly placeholder="স্বয়ংক্রিয়ভাবে কথায় আসবে">
            </div>
        </div>
        
        <button type="submit" class="submit-btn">রিসিট জেনারেট করুন</button>
    </form>
</div>

<div class="container hidden" id="receipt-container">
    <div class="action-bar">
        <button class="btn btn-download" onclick="downloadPDF()">
            <span>📥</span> পিডিএফ ডাউনলোড
        </button>
        <button class="btn btn-edit" onclick="editForm()">
            <span>✏️</span> আবার এডিট করুন
        </button>
    </div>
    
    <div id="receipt-section">
        <div class="receipt-header">
            <div class="receipt-header-left">
                <img src="logodif.png" alt="Logo" id="company-logo">
            </div>
            <div class="receipt-header-right">
                <h1>দারুল ইত্তিহাদ ফাউন্ডেশন</h1>
                <p>নয়নপুর, কসবা, ব্রাহ্মণবাড়িয়া<br>ফোন: +৮৮০ ১৯২৫-৩০৬০০৪<br>ইমেইল: darulittihadfoundation@gmail.com</p>
            </div>
        </div>

        <div class="receipt-title">
            <span>টাকা জমার রিসিট</span>
        </div>

        <div class="receipt-meta">
            <div class="meta-item">রিসিট নং: <span id="r-receiptNo"></span></div>
            <div class="meta-item">তারিখ: <span id="r-date"></span></div>
        </div>

        <table class="receipt-table">
            <tr>
                <th>সদস্যের আইডি</th>
                <td id="r-memberId"></td>
            </tr>
            <tr>
                <th>প্রদানকারীর নাম</th>
                <td id="r-name"></td>
            </tr>
            <tr>
                <th>ঠিকানা</th>
                <td id="r-address"></td>
            </tr>
            <tr>
                <th>জমার খাত</th>
                <td id="r-category"></td>
            </tr>
            <tr>
                <th>বিবরণ</th>
                <td id="r-description"></td>
            </tr>
            <tr class="amount-row">
                <th>মোট টাকার পরিমাণ</th>
                <td id="r-amount"></td>
            </tr>
        </table>
        
        <div class="amount-words-box">
            <strong>কথায়: </strong> <span id="r-amountWords"></span>
        </div>

        <div class="signatures">
            <div class="sig-box">
                <img src="sign.png" alt="Approver" id="sign-approver">
                <div class="sig-line">অনুমোদনকারীর স্বাক্ষর</div>
            </div>
        </div>
    </div>
</div>

<script>
    // সদস্যের নামের তালিকা
    const memberNames = [
        "মোহাম্মদ রহমত উল্লাহ", "সাইফুল ইসলাম", "রাসেল রানা", "মোঃ আনিসুর রহমান", "মোহাম্মদ রুহুল আমিন",
        "রুহুল আমিন", "কাজী মেহেদী হাসান সানি", "মোঃ শাফায়েত হোসেন", "রকিবুল ইসলাম", "মোঃ রিয়াদুল ইসলাম",
        "কাজী মোঃ মোমিনুল ইসলাম", "মোহাম্মদ সামিউম বাছির", "জীবন মিয়া", "মোঃ পাবেল শেখ", "মোহাম্মদ আমির হোসেন",
        "সাইফুল ইসলাম ইরফান", "মোছাঃ মাহমুদা আক্তার", "মোঃ নিয়ামত মির্জা", "মোঃ ফয়সাল আহমেদ", "মোঃ রিমন",
        "রমজান হোসেন", "মোঃ মাসুম মিয়া", "আল আমিন (প্রবাসী)", "জুবায়ের", "তোফায়েল হোসেন",
        "হাফিজুর রহমান (সুমন)", "আরিফ", "ইসরাফিল", "আল আমিন হোসেন", "সানজিদা আক্তার",
        "আল আমিন (ব্যবসায়ী)", "ফয়সাল আহমেদ", "মোঃ হৃদয় মিয়া", "জিসান", "নুরুল ইসলাম",
        "মোঃ মিরাজ হোসেন", "পারভেজ মিয়া", "কাওসার আলম", "মোঃ রাসেল", "খাদিজাতুল ইনতে আয়রা"
    ];

    // ইংরেজি সংখ্যাকে বাংলা সংখ্যায় রূপান্তর
    function toBanglaNumber(num) {
        const engToBng = { '0': '০', '1': '১', '2': '২', '3': '৩', '4': '৪', '5': '৫', '6': '৬', '7': '৭', '8': '৮', '9': '৯' };
        return num.toString().split('').map(digit => engToBng[digit] || digit).join('');
    }

    // ড্রপডাউনে অপশন যুক্ত করা
    const memberSelect = document.getElementById('memberSelect');
    memberNames.forEach((name, index) => {
        let idStr = (index + 1).toString().padStart(2, '0');
        let banglaIdStr = toBanglaNumber(idStr);
        
        let option = document.createElement('option');
        // value এর মধ্যে আইডি এবং নাম একসাথে রাখা হলো যেন পরে আলাদা করা যায়
        option.value = `${banglaIdStr}|${name}`;
        option.text = `${banglaIdStr} - ${name}`;
        memberSelect.appendChild(option);
    });

    const banglaWords = [
        "", "এক", "দুই", "তিন", "চার", "পাঁচ", "ছয়", "সাত", "আট", "নয়", "দশ",
        "এগারো", "বারো", "তেরো", "চৌদ্দ", "পনেরো", "ষোল", "সতেরো", "আঠারো", "উনিশ", "বিশ",
        "একুশ", "বাইশ", "তেইশ", "চব্বিশ", "পঁচিশ", "ছাব্বিশ", "সাতাশ", "আঠাশ", "ঊনত্রিশ", "ত্রিশ",
        "একত্রিশ", "বত্রিশ", "তেত্রিশ", "চৌত্রিশ", "পঁয়ত্রিশ", "ছত্রিশ", "সাঁইত্রিশ", "আটত্রিশ", "ঊনচল্লিশ", "চল্লিশ",
        "একচল্লিশ", "বিয়াল্লিশ", "তেতাল্লিশ", "চুয়াল্লিশ", "পঁয়তাল্লিশ", "ছেচল্লিশ", "সাতচল্লিশ", "আটচল্লিশ", "ঊনপঞ্চাশ", "পঞ্চাশ",
        "একান্ন", "বায়ান্ন", "তিপ্পান্ন", "চুয়ান্ন", "পঞ্চান্ন", "ছাপ্পান্ন", "সাতান্ন", "আটান্ন", "ঊনষাট", "ষাট",
        "একষট্টি", "বাষট্টি", "তেষট্টি", "চৌষট্টি", "পঁয়ষট্টি", "ছেষট্টি", "সাতষট্টি", "আটষট্টি", "ঊনসত্তর", "সত্তর",
        "একাত্তর", "বাহাত্তর", "তিয়াত্তর", "চুয়াত্তর", "পঁচাত্তর", "ছিয়াত্তর", "সাতাত্তর", "আটাত্তর", "ঊনআশি", "আশি",
        "একাশি", "বিরাশি", "তিরাশি", "চুরাশি", "পঁচাশি", "ছিয়াশি", "সাতাশি", "অষ্টাশি", "ঊননব্বই", "নব্বই",
        "একানব্বই", "বিরানব্বই", "তিরানব্বই", "চুরানব্বই", "পঁচানব্বই", "ছিয়ানব্বই", "সাতানব্বই", "আটানব্বই", "নিরানব্বই"
    ];

    function convertNumberToBanglaWords(num) {
        if (num === 0) return "শূন্য টাকা মাত্র";
        if (num > 999999999) return "অঙ্কটি অনেক বড়";
        
        let str = "";
        let crore = Math.floor(num / 10000000);
        let lakh = Math.floor((num % 10000000) / 100000);
        let thousand = Math.floor((num % 100000) / 1000);
        let hundred = Math.floor((num % 1000) / 100);
        let rest = num % 100;
        
        if (crore > 0) str += banglaWords[crore] + " কোটি ";
        if (lakh > 0) str += banglaWords[lakh] + " লাখ ";
        if (thousand > 0) str += banglaWords[thousand] + " হাজার ";
        if (hundred > 0) str += banglaWords[hundred] + " শত ";
        if (rest > 0) str += banglaWords[rest] + " ";
        
        return str.trim() + " টাকা মাত্র";
    }

    document.getElementById('amount').addEventListener('input', function() {
        const num = parseInt(this.value);
        const wordsField = document.getElementById('amountWords');
        if (isNaN(num) || num <= 0) { wordsField.value = ""; } 
        else { wordsField.value = convertNumberToBanglaWords(num); }
    });

    document.getElementById('date').valueAsDate = new Date();

    document.getElementById('receiptForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const checkboxes = document.querySelectorAll('input[name="category"]:checked');
        if(checkboxes.length === 0) {
            alert("অনুগ্রহ করে অন্তত একটি জমার খাত নির্বাচন করুন!");
            return;
        }
        
        let selectedCategories = [];
        checkboxes.forEach((cb) => {
            selectedCategories.push(cb.value);
        });
        const categoryText = selectedCategories.join(', ');

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');

        const receiptNo = `REC-${year}${month}${day}-${hours}${minutes}${seconds}`;

        document.getElementById('r-receiptNo').innerText = receiptNo;
        
        const rawDate = document.getElementById('date').value.split('-');
        const formattedDate = `${rawDate[2]}-${rawDate[1]}-${rawDate[0]}`;
        document.getElementById('r-date').innerText = formattedDate;

        // ড্রপডাউন থেকে আইডি এবং নাম আলাদা করে রিসিটে বসানো
        const selectedMemberData = document.getElementById('memberSelect').value.split('|');
        const selectedId = selectedMemberData[0];
        const selectedName = selectedMemberData[1];
        
        document.getElementById('r-memberId').innerText = selectedId;
        document.getElementById('r-name').innerText = selectedName;
        
        let addressValue = document.getElementById('address').value;
        document.getElementById('r-address').innerText = addressValue ? addressValue : "প্রযোজ্য নয়";
        
        document.getElementById('r-category').innerText = categoryText;
        
        let descValue = document.getElementById('description').value;
        document.getElementById('r-description').innerText = descValue ? descValue : "প্রযোজ্য নয়";
        
        const amountNum = Number(document.getElementById('amount').value);
        document.getElementById('r-amount').innerText = amountNum.toLocaleString('en-IN') + " টাকা";
        document.getElementById('r-amountWords').innerText = document.getElementById('amountWords').value;

        document.getElementById('form-container').classList.add('hidden');
        document.getElementById('receipt-container').classList.remove('hidden');
    });

    function editForm() {
        document.getElementById('receipt-container').classList.add('hidden');
        document.getElementById('form-container').classList.remove('hidden');
    }

    function downloadPDF() {
        const element = document.getElementById('receipt-section');
        const receiptNo = document.getElementById('r-receiptNo').innerText;
        
        const opt = {
            margin:       [0.2, 0.3, 0.2, 0.3], 
            filename:     'Payment_Receipt_' + receiptNo + '.pdf',
            image:        { type: 'jpeg', quality: 1 },
            html2canvas:  { scale: 2, useCORS: true },
            jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save();
    }
</script>
